<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Video player</title><link rel="stylesheet" href="/style.css"><script src="/player.js" type="module"></script></head>
<body><main id="player" class="player" tabindex="0" aria-label="Video player"><div id="stage" class="stage">
<video id="video" playsinline preload="none"></video>
<header class="top overlay">
<div class="identity"><div id="avatar" class="avatar" aria-hidden="true"><span>▶</span><img id="avatar-image" alt="" hidden></div><div class="heading"><span id="title">Telegram video</span><span id="channel-label">PLAYER</span></div></div>
<button id="settings" class="icon settings-button" aria-label="Playback settings" aria-expanded="false" aria-controls="settings-panel" title="Settings"><svg viewBox="0 0 32 32"><path d="m13 3-1 4-3 1-3-2-3 5 3 3v4l-3 3 3 5 3-2 3 1 1 4h6l1-4 3-1 3 2 3-5-3-3v-4l3-3-3-5-3 2-3-1-1-4Z"/><circle cx="16" cy="16" r="5"/></svg></button>
</header>
<div class="center-controls overlay">
<button id="center-play" class="center-button" aria-label="Play video" title="Play / Pause"><svg viewBox="0 0 40 40"><path id="play-icon" d="M10 5 34 20 10 35Z"/></svg></button>
<button id="next" class="next-button" aria-label="Skip forward 10 seconds" title="Skip forward 10 seconds"><svg viewBox="0 0 40 40"><path d="M7 6 31 20 7 34Z"/><path d="M33 6v28" class="stroke"/></svg></button>
</div>
<div id="seek-feedback" class="seek-feedback" role="status" aria-live="polite" hidden></div>
<div id="loading" class="loading" role="status" aria-label="Loading video" hidden></div>
<div id="notice" class="notice" hidden><p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>Try again</button><button id="try-quality" hidden>Try another quality</button></div>
<section id="settings-panel" class="panel settings-panel" aria-label="Playback settings" hidden>
<div class="panel-heading">Settings<button class="close-panel" aria-label="Close settings">×</button></div>
<label>Quality<select id="quality" disabled><option>Available on play</option></select></label>
<label>Subtitles<select id="subtitles"><option value="-1">Off</option></select></label>
<button id="retry-subtitles" hidden>Retry selected subtitles <span>↻</span></button>
<button id="add-subtitles">Other… Add your subtitle file <span>＋</span></button>
<input id="subtitle-file" type="file" accept=".srt,.vtt,.ass,.ssa" hidden>
<button id="remove-subtitles" hidden>Remove your subtitle file <span>×</span></button>
<p id="subtitle-status" class="subtitle-status" role="status">Embedded tracks appear when the browser supports them. Add SRT, VTT, ASS or SSA from your device (max 2 MB).</p>
<label>Audio language<select id="audio-language" disabled><option>Available after Play</option></select></label>
<p id="audio-status" class="subtitle-status" role="status">Audio languages are discovered when the video loads.</p>
<label>Playback speed<select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>Normal</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
<label>Volume<input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></label>
<button id="rotate">Landscape fullscreen <span>↻</span></button>
<button id="pip">Picture in picture <span>▣</span></button>
</section>
<section id="playlist-panel" class="panel playlist-panel" aria-label="Video list" hidden><div class="panel-heading">Videos<button class="close-panel" aria-label="Close video list">×</button></div><button id="current-video" class="video-item"><span>▶</span><span id="playlist-title">Current video</span></button><button id="next-video" class="video-item" hidden><span>▶</span><span>Next video</span></button></section>
<div class="controls overlay">
<button id="playlist" class="icon" aria-label="Video list" aria-expanded="false" aria-controls="playlist-panel" title="Videos"><svg viewBox="0 0 32 32"><path d="M3 6h24M3 16h24M3 26h8"/><path class="fill" d="m20 22 9 5-9 5Z"/></svg></button>
<div class="timeline"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek video" disabled></div>
<button id="mute" class="icon" aria-label="Mute" title="Mute"><svg viewBox="0 0 32 32"><path d="M3 12h7l8-9v26l-8-9H3Z"/><path id="sound-waves" d="M23 10q7 6 0 12"/><path id="sound-muted" d="m24 12 6 8m0-8-6 8" hidden/></svg></button>
<button id="captions" class="icon" aria-label="Subtitle settings" title="Subtitles"><svg viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="3"/><path d="M8 17h7m5 0h4M8 23h3m5 0h8"/></svg></button>
<button id="fullscreen" class="icon" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 32 32"><path d="M12 3v5a4 4 0 0 1-4 4H3m17-9v5a4 4 0 0 0 4 4h5M3 20h5a4 4 0 0 1 4 4v5m17-9h-5a4 4 0 0 0-4 4v5"/></svg></button>
</div></div></main></body></html>
